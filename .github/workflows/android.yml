name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances système (automake, libffi, etc.)
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Installation de Buildozer
        run: pip install --upgrade Cython buildozer virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Compilation de l'APK (Debug)
        run: yes | buildozer -v android debug

      - name: Sauvegarde de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: dekdrivsim-apk
          path: bin/*.apk
          retention-days: 7
