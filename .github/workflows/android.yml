name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verrouillage de pip sur une version compatible
        run: |
          python -m pip install --upgrade "pip==23.3.1" "setuptools<70" wheel

      - name: Installation des dépendances système
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

      - name: Installation de Buildozer et P4A
        run: |
          python -m pip install --upgrade "Cython<3.0" "buildozer>=1.4.6" virtualenv
          python -m pip install --upgrade "python-for-android>=2024.1"

      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Compilation de l'APK (Debug)
        run: yes | buildozer -v android debug

      - name: Sauvegarde de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: dekdrivsim-apk
          path: bin/*.apk
          retention-days: 7
